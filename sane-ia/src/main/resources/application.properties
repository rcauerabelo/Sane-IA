spring.application.name=sane-ia

# Banco H2 em memoria (dados zeram ao reiniciar). Para MySQL/PostgreSQL, troque url/driver.
spring.datasource.url=jdbc:h2:mem:saneia
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
saneia.uploads.dir=uploads

# IA (Groq, formato compativel com OpenAI). A chave vem de variavel de ambiente: NAO coloque no codigo.
ia.api.url=https://api.groq.com/openai/v1/chat/completions
ia.api.key=${GROQ_API_KEY:}
ia.api.model=openai/gpt-oss-120b
server.port=8081
   server.error.include-message=always
